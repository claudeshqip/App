name: Windows

on:
  push:
    paths:
      - "app.py"
      - "desktop.py"
      - "requirements.txt"
      - "templates/**"
      - "static/**"
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview pyinstaller

      - name: Download ffmpeg and deno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item ffmpeg\*\bin\ffmpeg.exe, ffmpeg\*\bin\ffprobe.exe bin\
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath bin
          Set-Content -NoNewline -Encoding ascii VERSION $env:APP_VERSION
          Get-ChildItem bin

      - name: Build Shkarko.exe
        run: >
          pyinstaller desktop.py --name Shkarko --windowed --noconfirm
          --icon windows/shkarko.ico
          --add-data "templates;templates"
          --add-data "static;static"
          --add-data "VERSION;."
          --add-data "bin;bin"
          --collect-all yt_dlp
          --collect-all yt_dlp_ejs
          --collect-all webview

      - name: Self-test
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\selftest.log"
          $p = Start-Process dist\Shkarko\Shkarko.exe -ArgumentList "--selftest", $log -Wait -PassThru
          Get-Content $log
          exit $p.ExitCode

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" windows\shkarko.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: Shkarko-Windows
          path: dist/Shkarko-Setup-x64.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows
          name: Shkarko për Windows
          make_latest: false
          files: dist/Shkarko-Setup-x64.exe
          body: |
            Shkarko `Shkarko-Setup-x64.exe` dhe instaloje në Windows 11 (x64).
            Ky release përditësohet me çdo version të ri (versioni aktual: ${{ env.APP_VERSION }}).
